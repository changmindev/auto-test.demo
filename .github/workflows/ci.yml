name: CI

# 이 저장소는 실기기(Android + Appium)가 있어야 돈다. CI 러너에는 기기가 없으므로
# 자동화 실행 자체는 검사하지 않고, 기기 없이도 확인할 수 있는 것만 본다:
# 문법 오류와, 견본 TC(testcases.sample.xlsx)가 깨지지 않고 읽히는지.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 문법 검사
        run: python -m compileall -q .

      - name: 견본 TC 파싱 확인
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.loader import load_cases
          cases = load_cases(Path("testcases.sample.xlsx"), "automation_TC")
          assert len(cases) == 10, f"견본 TC 가 10건이어야 하는데 {len(cases)}건"
          print(f"견본 TC {len(cases)}건 정상 로드")
          PY
